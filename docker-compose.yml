# Définitions communes (tâche 4.2) — jamais utilisées seules : aucun port publié, aucun identifiant.
#
#   Développement : docker compose up                (+ docker-compose.override.yml, chargé
#                                                     automatiquement : ports, identifiants de dev)
#   Production    : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#                                                    (mots de passe obligatoires, Redis protégé)
#
# `migrate` applique `alembic upgrade head` une fois, avant l'API et les workers.

services:
  migrate:
    build:
      context: .
      target: api
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    env_file:
      - .env
    volumes:
      # Rapports déposés, preuves et PDF de synthèse — partagés avec les workers.
      - storage:/code/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Worker par défaut (tâche 4.1) : e-mails, PDF de synthèse, tâche planifiée — image légère.
  worker:
    build:
      context: .
      target: api
    command: ["arq", "app.worker.settings.WorkerSettings"]
    env_file:
      - .env
    volumes:
      - storage:/code/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Worker d'extraction : une extraction à la fois — pour plus de débit, augmenter ses réplicas.
  worker-extraction:
    build:
      context: .
      target: worker
    env_file:
      - .env
    volumes:
      - storage:/code/storage
      # Modèles téléchargés au premier usage (bge-m3, Docling) : conservés entre redémarrages.
      - modeles:/home/greenfinance/.cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: greenfinance
      POSTGRES_DB: greenfinance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenfinance"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  storage:
  modeles:
