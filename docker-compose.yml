# Définitions communes (tâche 4.2) — jamais utilisées seules : aucun port publié, aucun identifiant.
#
#   Développement : docker compose up                (+ docker-compose.override.yml, chargé
#                                                     automatiquement : ports, identifiants de dev)
#   Production    : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#                                                    (mots de passe obligatoires, Redis protégé)
#
# `migrate` applique `alembic upgrade head` une fois, avant l'API et les workers.

services:
  migrate:
    build:
      context: .
      target: api
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    env_file:
      - .env
    volumes:
      # Rapports déposés, preuves et PDF de synthèse — partagés avec les workers.
      - storage:/code/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Worker par défaut (tâche 4.1) : e-mails, PDF de synthèse, tâche planifiée — image légère.
  worker:
    build:
      context: .
      target: api
    command: ["arq", "app.worker.settings.WorkerSettings"]
    env_file:
      - .env
    volumes:
      - storage:/code/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Worker d'extraction : une extraction à la fois — pour plus de débit, augmenter ses réplicas.
  worker-extraction:
    build:
      context: .
      target: worker
    env_file:
      - .env
    volumes:
      # Modèles (Docling, OCR, bge-m3) intégrés à l'image à la construction : aucun volume.
      - storage:/code/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Serveur MCP de l'extraction (app/mcp/serveur.py), lancé par l'agent et jamais en tâche de fond :
  #   docker compose --profile mcp run --rm -i -v "$PWD/rapports:/data:ro" mcp
  # Sans base de données. Partage le budget mémoire du worker d'extraction : sur la VM, à lancer
  # quand celui-ci est inactif.
  mcp:
    profiles: ["mcp"]
    build:
      context: .
      target: mcp
    env_file:
      - .env
    environment:
      EXTRACTION_THREADS: "3"
      OMP_NUM_THREADS: "3"
      TOKENIZERS_PARALLELISM: "false"
    stdin_open: true
    mem_limit: 12g
    cpus: 3

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: greenfinance
      POSTGRES_DB: greenfinance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenfinance"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  storage:
