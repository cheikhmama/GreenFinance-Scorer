services:
  api:
    build: .
    ports:
      # Même port des deux côtés : c'est aussi ce que vite.config.ts cible en dev
      # (voir frontend/vite.config.ts) — un seul port à retenir, que l'API tourne
      # via ce conteneur ou via `uvicorn` lancé localement.
      - "8000:8000"
    env_file:
      - .env
    environment:
      # À l'intérieur du réseau Docker, la base est joignable via le nom de
      # service "db", pas "localhost" (qui désignerait le conteneur api lui-même).
      DATABASE_URL: postgresql+psycopg://greenfinance:changeme@db:5432/greenfinance
      REDIS_URL: redis://redis:6379/0
    volumes:
      # Rapports déposés et artefacts d'extraction (Étape 5) — sans ça, perdus à chaque
      # recréation du conteneur, même besoin de durabilité que pgdata ci-dessous.
      - ./storage:/code/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Workers ARQ (tâche 4.1) : même image que l'API pour l'instant — images séparées avec la tâche
  # 4.2 (seul le worker d'extraction a besoin de Docling/torch). Le worker « default » traite
  # e-mails et PDF de synthèse et porte la tâche planifiée ; le worker « extraction » ne traite
  # qu'une extraction à la fois — pour plus de débit, augmenter ses réplicas.
  worker:
    build: .
    command: ["arq", "app.worker.settings.WorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://greenfinance:changeme@db:5432/greenfinance
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./storage:/code/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-extraction:
    build: .
    command: ["arq", "app.worker.settings.ExtractionWorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://greenfinance:changeme@db:5432/greenfinance
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./storage:/code/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: greenfinance
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: greenfinance
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenfinance"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
