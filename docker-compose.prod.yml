# Production (tâche 4.2) :
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# POSTGRES_PASSWORD et REDIS_PASSWORD sont obligatoires (environnement ou .env du déploiement) :
# sans eux, la commande échoue avant de démarrer quoi que ce soit. Seule l'API publie un port —
# derrière le reverse proxy, qui doit aussi figurer dans FORWARDED_ALLOW_IPS. Postgres et Redis ne
# sont joignables que sur le réseau Docker. La base de données de .env (DATABASE_URL, REDIS_URL)
# est remplacée ici pour pointer sur ces services avec leurs mots de passe.

x-environnement-prod: &environnement-prod
  DATABASE_URL: postgresql+psycopg://greenfinance:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}@db:5432/greenfinance
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD requis}@redis:6379/0
  ENVIRONMENT: production

services:
  migrate:
    environment: *environnement-prod

  api:
    ports:
      - "8000:8000"
    environment: *environnement-prod
    restart: unless-stopped

  worker:
    environment: *environnement-prod
    restart: unless-stopped

  worker-extraction:
    environment: *environnement-prod
    restart: unless-stopped

  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    restart: unless-stopped

  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD requis}"]
    environment:
      # Lu par redis-cli (healthcheck) : le mot de passe n'apparaît pas dans la commande.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD requis}
    restart: unless-stopped
