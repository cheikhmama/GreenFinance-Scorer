[project]
name = "greenfinance-scorer"
version = "0.1.0"
description = "Plateforme de scoring ESG et carbone pour entreprises"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "pydantic[email]",
    "pytest",
    "pytest-cov",
    "structlog",
    "pyjwt",
    "passlib[bcrypt]",
    "bcrypt<4.1",  # passlib 1.7.4 ne reconnaît pas l'API de bcrypt >=4.1 (module __about__ retiré)
    "redis",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
    "httpx",
    "types-passlib",
]
notebook = [
    "jupyter",
    "ipykernel",
    "docling",
    "paddlepaddle",
    "paddleocr",
    "pymupdf",
    "faiss-cpu",
    "FlagEmbedding",
    "anthropic",
    "pyyaml",
    "torch",
    "torchvision",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff.lint.flake8-bugbear]
# B008 (function call in default argument) est un faux positif pour ces
# appels : c'est l'idiome FastAPI standard pour l'injection de dépendances,
# pas un défaut mutable partagé entre appels.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Cookie", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
