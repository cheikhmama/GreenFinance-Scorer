[project]
name = "greenfinance-scorer"
version = "0.1.0"
description = "Plateforme de scoring ESG et carbone pour entreprises"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "pytest",
    "pytest-cov",
    "structlog",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
    "httpx",
]
notebook = [
    "jupyter",
    "ipykernel",
    "docling",
    "paddlepaddle",
    "paddleocr",
    "pymupdf",
    "faiss-cpu",
    "FlagEmbedding",
    "anthropic",
    "pyyaml",
    "torch",
    "torchvision",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
