[project]
name = "greenfinance-scorer"
version = "0.1.0"
description = "Plateforme de scoring ESG et carbone pour entreprises"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "pytest",
    "pytest-cov",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
    "httpx",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
