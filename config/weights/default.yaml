# Méthodologie de référence GreenFinance Scorer — version 1 (Phase 5 §9).
#
# Chaque chiffre ici est une décision méthodologique, pas un détail technique : le changer
# produit une nouvelle version de la notation, pas juste un ajustement de code. Validée sur les
# deux entreprises synthétiques de data_test/reference_e2e/ (atlas_industries, nordwind_energie)
# avant tout usage sur des entreprises réelles.
#
# Bornes de normalisation : choisies comme des ordres de grandeur raisonnables pour un premier
# jet, pas des seuils benchmarkés sur un référentiel sectoriel externe — à réviser (nouvelle
# version) une fois un vrai corpus d'entreprises comparables disponible.
#
# Poids des indicateurs Social/Gouvernance : socle minimal harmonisé retenu après analyse de
# data_test/reference_esg_8_entreprises.json — seuls les indicateurs présents chez la quasi-
# totalité des 8 entreprises de référence et directement comparables entre elles (voir le
# diagnostic associé). Les taux d'accidents du travail et le % d'administrateurs indépendants en
# sont délibérément exclus : trop hétérogènes (métriques et dénominateurs différents selon
# l'entreprise) pour ne pas produire une comparaison silencieusement fausse.

