# Méthodologie de référence GreenFinance Scorer — version 2.
#
# Chaque chiffre ici est une décision méthodologique, pas un détail technique : le changer
# produit une nouvelle version de la notation, pas juste un ajustement de code. Validée sur les
# deux entreprises synthétiques de data_test/reference_e2e/ (atlas_industries, nordwind_energie)
# avant tout usage sur des entreprises réelles.
#
# Bornes de normalisation : choisies comme des ordres de grandeur raisonnables pour un premier
# jet, pas des seuils benchmarkés sur un référentiel sectoriel externe — à réviser (nouvelle
# version) une fois un vrai corpus d'entreprises comparables disponible.
#
# Ce que le score calculé n'inclut jamais, par principe (pas une omission à corriger) :
#   - le tonnage carbone brut Scope 1/2/3 (DonneeCarbone) : sans dénominateur (CA, effectif,
#     production...), normaliser une valeur absolue pénaliserait mécaniquement une grande
#     entreprise face à une petite. Les 3 indicateurs d'intensité carbone ci-dessous sont le
#     proxy déjà normalisé et correct pour cette dimension — c'est volontairement leur rôle.
#   - les scores auto-déclarés par l'entreprise (score_global_declare et les 3 codes
#     score_{environnement,social,gouvernance}_declare) : les mélanger au score calculé par la
#     plateforme contredirait le principe "jamais de boîte noire, jamais un chiffre qu'on ne
#     peut pas défendre" — ils restent extraits et affichés séparément, jamais fondus ici.
#
# Poids et bornes des indicateurs Social/Gouvernance/Environnement (hors intensités carbone,
# déjà validées à la v1) : socle harmonisé retenu après analyse de
# data_test/reference_esg_8_entreprises.json — seuls les indicateurs directement comparables
# entre entreprises (même métrique, même dénominateur implicite) y sont ajoutés. Sont
# délibérément exclus, criblés avec le même critère à la v2 :
#   - taux_frequence_accidents : 7 métriques différentes selon l'entreprise dans le corpus de
#     référence (TRIFR/AIFR/TRIR/LTIFR/TRFR/"Fréquence"/"Taux accidents"), dénominateurs non
#     harmonisés (par 200 000h, par million d'heures, non précisé) — comparer ferait mentir.
#   - administrateurs_independants_pourcentage : hétérogénéité déjà constatée dans le corpus.
#   - taille_conseil : pas de sens monotone défendable (ni "plus c'est mieux" ni l'inverse — la
#     bonne pratique vise une fourchette, pas un extremum), et normaliser() ne modélise que des
#     directions strictement monotones.
#   - effectif_total : grandeur brute (effectif), pas un ratio — même raisonnement que
#     l'exclusion du tonnage carbone brut ci-dessus : une grande entreprise n'est pas "moins
#     bonne" qu'une petite, comparer les effectifs bruts n'a pas de sens en score ESG.
#   - heures_formation_par_employe : candidat légitime mais écarté à la v2, faute de matérialité
#     suffisante dans le corpus de référence (une seule entreprise sur 8 le rapporte).
#
# Indicateurs ajoutés à la v2, avec leur justification de borne :
#   - femmes_effectif_pourcentage : même famille que femmes_management_pourcentage/
#     femmes_conseil_pourcentage déjà en v1, borne 0/50 par la même convention "parité" (au-delà
#     de 50% on change de sens de déséquilibre). Preuve : 5/8 entreprises du corpus de référence
#     rapportent ce code exact (8.36% à 40.4%), borne 0/50 cohérente avec cette plage.
#   - part_renouvelable_pourcentage : AUCUNE entreprise du corpus de référence ne rapporte ce
#     code exact — seules des métriques voisines (energie_renouvelable_pourcentage,
#     electricite_renouvelable_pourcentage) y apparaissent, observées entre 24% et 98.6%. Borne
#     0/100 retenue par analogie de grandeur (un pourcentage de part renouvelable), PAS par une
#     correspondance de code vérifiée — à réviser en priorité dès qu'un vrai rapport fournit ce
#     code précis.
#   - dechets_valorises_pourcentage : aucun point de données dans le corpus de référence, sous
#     aucun nom de code. Borne 0/100 retenue par pur raisonnement (c'est un pourcentage) — la
#     borne la plus provisoire de ce fichier, à réviser dès la première donnée réelle disponible.

version: 2
nom: "Méthodologie de référence GreenFinance Scorer"

