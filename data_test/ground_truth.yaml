# Vérité terrain du corpus pilote — Étape 4 (validation autonome du pipeline d'extraction).
#
# Provenance : chaque entrée a été établie par un agent de recherche dédié, qui a lu le PDF source
# directement (outil Read, page par page) et vérifié l'identité de l'entreprise avant d'en extraire
# une valeur — indépendamment du pipeline Docling/BGE-M3/Claude qui sera testé aux Prompts 4.2-4.5.
# Chaque fiche a été présentée à l'utilisateur pour relecture avant d'être écrite ici.
#
# Corpus pilote réduit à 4 entreprises (décision explicite, en écart avec le plan initial qui en
# prévoyait 8) : schneider_electric, microsoft, orsted, ingka_group. Les PDF apple, totalenergies,
# unilever, nestle restent dans storage/pilot_corpus/ (téléchargés lors d'une session précédente) mais
# sont hors périmètre retenu pour le verdict GO/NO-GO du Prompt 4.6 — leurs valeurs n'ont jamais été
# vérifiées manuellement et ne doivent pas être réutilisées sans le faire.
#
# "page_attendue" est le numéro de page PHYSIQUE dans le fichier PDF (tel que rapporté par l'outil
# Read), pas nécessairement le numéro imprimé en pied de page.

entreprises:
  - nom: schneider_electric
    nom_rapport: "Sustainable Development Report 2025"
    annee: 2025
    url: https://www.se.com/ww/en/download/document/2025_Sustainability_Report/
    document: storage/pilot_corpus/schneider_electric.pdf
    indicateurs:
      - code: scope_1
        valeur_attendue: 100309.0
        unite: tCO2e
        page_attendue: 82
      - code: scope_2_market_based
        valeur_attendue: 23849.0
        unite: tCO2e
        page_attendue: 82
      - code: scope_2_location_based
        valeur_attendue: 409343.0
        unite: tCO2e
        page_attendue: 82
      - code: scope_3
        valeur_attendue: 60581278.0
        unite: tCO2e
        page_attendue: "82-83"
    notes: >
      Le plan initial de l'Étape 4 citait comme exemple, pour Schneider Electric,
      "scope_1_2_marketbased_tco2e: 143708, page 346-347" — un chiffre qui ne correspond PAS à ce qui a
      été vérifié ici (Scope 1+2 market-based combiné = 124158 tCO2e, pages 82-83, dans le Sustainable
      Development Report 2025). Page 346-347 correspondrait plutôt à l'échelle du Document
      d'Enregistrement Universel 2025 (~550 pages, non utilisé ici) — probablement une source et/ou une
      année différente. Discrépance à clarifier avant de trancher entre les deux sources.
      Un domaine se.com protégé par anti-bot (Akamai) a bloqué les téléchargements directs ; le PDF a
      été obtenu via le CDN documentaire officiel (download.se.com). Un faux miroir tiers présenté comme
      le rapport Schneider Electric s'est avéré être un document d'Orange S.A. — détecté et écarté avant
      usage.

