# Vérité terrain du corpus pilote — Étape 4 (validation autonome du pipeline d'extraction).
#
# Provenance : chaque entrée a été établie par un agent de recherche dédié, qui a lu le PDF source
# directement (outil Read, page par page) et vérifié l'identité de l'entreprise avant d'en extraire
# une valeur — indépendamment du pipeline Docling/BGE-M3/Claude qui sera testé aux Prompts 4.2-4.5.
# Chaque fiche a été présentée à l'utilisateur pour relecture avant d'être écrite ici.
#
# Corpus pilote réduit à 3 entreprises (décision explicite du 2026-08-20, en écart avec le plan
# initial qui en prévoyait 8, puis avec la réduction précédente à 4) : microsoft, orsted, ingka_group.
# schneider_electric a été retiré du corpus actif : son PDF ("Sustainable Development Report 2025")
# n'a pas pu être retéléchargé — se.com est protégé par un anti-bot (Akamai) qui bloque aussi bien un
# accès direct qu'un accès via un outil de fetch dédié, et aucun miroir légitime n'a été trouvé. Trois
# rapports ont été jugés suffisants pour valider le protocole du Prompt 4.3 (11/15 retrieval_recall_at_8,
# 73,3 %, deux rapports à 100 %) sans attendre la résolution de ce blocage. Les PDF apple, totalenergies,
# unilever, nestle restent dans storage/pilot_corpus/ (téléchargés lors d'une session précédente) mais
# sont hors périmètre retenu pour le verdict GO/NO-GO du Prompt 4.6 — leurs valeurs n'ont jamais été
# vérifiées manuellement et ne doivent pas être réutilisées sans le faire.
#
# "page_attendue" est le numéro de page PHYSIQUE dans le fichier PDF (tel que rapporté par l'outil
# Read), pas nécessairement le numéro imprimé en pied de page.

entreprises:
  - nom: microsoft
    nom_rapport: "2025 Environmental Sustainability Report — Data Fact Sheet"
    annee: "FY2024 (1 juillet 2023 - 30 juin 2024)"
    url: https://cdn-dynmedia-1.microsoft.com/is/content/microsoftcorp/microsoft/msc/documents/presentations/CSR/2025-Microsoft-Environmental-Data-Fact-Sheet-PDF.pdf
    document: storage/pilot_corpus/microsoft.pdf
    indicateurs:
      - code: scope_1
        valeur_attendue: 143510.0
        unite: tCO2e
        page_attendue: 3
      - code: scope_2_market_based
        valeur_attendue: 259090.0
        unite: tCO2e
        page_attendue: 3
      - code: scope_2_location_based
        valeur_attendue: 9955368.0
        unite: tCO2e
        page_attendue: 3
      - code: scope_3
        valeur_attendue: 15140000.0
        unite: tCO2e
        page_attendue: 3
    notes: >
      Un rapport plus récent (2026 Environmental Sustainability Report, données FY2025) existe mais n'a
      pas été utilisé — le fichier FY2024 déjà présent dans le corpus a été réutilisé tel quel.

  - nom: orsted
    nom_rapport: "Annual Report 2025"
    annee: 2025
    url: https://cdn.orsted.com/-/media/annual-2025/annual-report-2025.pdf
    document: storage/pilot_corpus/orsted.pdf
    cas_test_special: >
      Ørsted rapporte son empreinte carbone principalement en INTENSITÉ (g CO2e/kWh), pas en valeur
      absolue — cas volontairement différent des 7 autres entreprises du corpus.
    indicateurs:
      - code: intensite_scope_1_2_marketbased
        valeur_attendue: 4.0
        unite: gCO2e/kWh
        page_attendue: 79
      - code: intensite_scope_1_2_3_hors_cat11
        valeur_attendue: 69.0
        unite: gCO2e/kWh
        page_attendue: 79
      - code: intensite_scope_1_2_3_total
        valeur_attendue: 24.0
        unite: gCO2e/kWh
        page_attendue: 79
      - code: scope_1
        valeur_attendue: 184732.0
        unite: tCO2e
        page_attendue: 78
      - code: scope_2_market_based
        valeur_attendue: 736.0
        unite: tCO2e
        page_attendue: 78
      - code: scope_2_location_based
        valeur_attendue: 53100.0
        unite: tCO2e
