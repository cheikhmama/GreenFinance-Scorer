  - nom: ingka_group
    nom_rapport: "Ingka Group Annual Summary and Sustainability Report FY25"
    annee: "FY25 (1 septembre 2024 - 31 aout 2025)"
    url: null
    document: storage/pilot_corpus/ingka_group.pdf
    indicateurs:
      - code: scope_1
        valeur_attendue: 78537.0
        unite: tCO2e
        page_attendue: 70
      - code: scope_2_market_based
        valeur_attendue: 21460.0
        unite: tCO2e
        page_attendue: 70
      - code: scope_2_location_based
        valeur_attendue: 703221.0
        unite: tCO2e
        page_attendue: 69
      - code: scope_3
        valeur_attendue: 4265957.0
        unite: tCO2e
        page_attendue: 70
    notes: >
      "Ingka Group" est l'entité qui possède/exploite ~87,4% des magasins IKEA, distincte d'Inter IKEA
      Group (franchiseur, propriétaire de marque). Le scope_3 ci-dessus couvre Ingka Group SEUL : pour
      FY25, Inter IKEA Group n'a pas encore publié ses données climat (categories Scope 3 partagées
      marquées N/A dans le rapport source, disponibles seulement avec le rapport FY26 d'Inter IKEA en
      nov. 2026). Comparaison FY24 (combiné Ingka+Inter IKEA) : 21 709 772 tCO2e de Scope 3 — donc le
      chiffre FY25 ci-dessus sous-estime largement l'empreinte réelle de la chaîne de valeur IKEA et
      n'est PAS comparable aux Scope 3 totaux des autres entreprises du corpus sans cette réserve.

